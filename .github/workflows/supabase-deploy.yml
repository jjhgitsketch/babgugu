name: Deploy Supabase

on:
  push:
    branches:
      - main
      - master
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy database migrations
        run: supabase db push

      - name: Deploy send-school-verification function
        run: supabase functions deploy send-school-verification --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy verify-school-verification function
        run: supabase functions deploy verify-school-verification --project-ref "$SUPABASE_PROJECT_ID"
