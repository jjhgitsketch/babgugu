name: mealmate
description: 혼밥 경험을 개선하는 식사 모임 서비스
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  supabase_flutter: ^2.3.0
  uuid: ^4.3.3
  image_picker: ^1.0.7
  url_launcher: ^6.3.1
  flutter_naver_map: ^1.3.1
  geolocator: ^12.0.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/babgugu_logo.png
    - assets/images/babgugu_loading_logo.png
    - assets/images/solo_places/
